[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rrf-softbody"
version = "0.2.0"
description = "Regional Response Feedback for real-to-sim deformable dynamics"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["numpy>=1.24,<2", "scipy>=1.10,<1.15", "torch==2.7.1", "kornia==0.8.1", "omegaconf==2.3.0", "hydra-core==1.3.2", "Pillow>=10,<12"]

[tool.setuptools.packages.find]
include = ["rrf*"]

[tool.setuptools.package-data]
rrf = ["configs/*.json", "configs/tasks/*.json"]
